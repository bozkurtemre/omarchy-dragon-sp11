## Keep PipeWire off the Surface Pro 11 virtual cameras (v4l2loopback,
## /dev/video40-41). PipeWire apps already get the real cameras through
## libcamera; probing the loopbacks would list each camera twice and wake the
## surface-camera relays. Installed by setup-camera.sh.

monitor.v4l2.rules = [
  {
    matches = [
      {
        device.name = "~v4l2_device._sys_devices_virtual_video4linux_.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
