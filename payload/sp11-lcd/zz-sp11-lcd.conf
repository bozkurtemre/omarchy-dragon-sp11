# Surface Pro 11 LCD (Snapdragon X Plus): bring up the panel and the keyboard
# before disk unlock. Installed by /usr/local/lib/sp11-lcd (sp11-lcd/README.md
# on the install USB); sorts last so nothing after it resets MODULES.
#
# Same set as Omarchy's Surface Pro 11 board script (install/hardware/microsoft/
# surface-pro-11.sh on the quattro branch), with the LCD's generic eDP panel
# driver in place of the OLED's Samsung one. The display driver waits for the
# USB-C DisplayPort chain, and pmic_glink needs the IPC router and PD mapper;
# the keyboard hangs off the Surface Aggregator. All are modules in
# linux-omarchy. As in i2c_hid_of_module.conf, names go in without ? and only
# when the kernel being built has them, since a systemd initramfs copies
# MODULES as written into modules-load.d. The DSP driver stays out on purpose.
for _sp11_module in msm dispcc-x1e80100 gpucc-x1e80100 videocc-sm8550 phy-qcom-edp \
  panel-edp phy-qcom-qmp-combo ps883x qrtr qcom_pd_mapper pmic_glink pmic_glink_altmode \
  i2c-qcom-geni surface_aggregator surface_aggregator_registry surface_aggregator_hub \
  surface_hid_core surface_hid; do
  if [[ $(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename "$_sp11_module" 2>/dev/null) == /* ]]; then
    MODULES+=("$_sp11_module")
  fi
done

# The GPU's microcode, requested as soon as msm loads. The board-signed zap
# shader comes in through qcom-firmware-extract's qcom-firmware.conf.
for _sp11_firmware in qcom/gen70500_sqe.fw qcom/gen70500_gmu.bin; do
  for _sp11_dir in /usr/lib/firmware/updates /usr/lib/firmware; do
    for _sp11_suffix in '' .zst .xz; do
      if [[ -f $_sp11_dir/$_sp11_firmware$_sp11_suffix ]]; then
        FILES+=("$_sp11_dir/$_sp11_firmware$_sp11_suffix")
        break 2
      fi
    done
  done
done
unset _sp11_module _sp11_firmware _sp11_dir _sp11_suffix
