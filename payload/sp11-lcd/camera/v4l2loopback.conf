# Surface Pro 11 cameras as V4L2 devices. Installed by setup-camera.sh.
#   video40  front camera   surface-camera@front (user service)
#   video41  back camera    surface-camera@back (user service)
#   video42  IR camera      surface-ir-camera (system service, ../ir-camera/)
options v4l2loopback devices=3 video_nr=40,41,42 card_label="Surface Front Camera,Surface Back Camera,Surface IR Camera" exclusive_caps=1,1,1
